services:
  secontrol:
    build: .
    container_name: secontrol
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"
    volumes:
      - secontrol-data:/data
    environment:
      APP_PORT: "${APP_PORT:-5000}"
      APP_ADDR: ":${APP_PORT:-5000}"
      APP_DATA_DIR: "/data"
      POLL_INTERVAL: "${POLL_INTERVAL:-60s}"
      APP_MASTER_KEY: "${APP_MASTER_KEY:-}"

volumes:
  secontrol-data:
    name: secontrol-data
